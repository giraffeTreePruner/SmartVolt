spring.application.name=SmartVolt Cloud

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartvolt}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HTTP (nginx is reverse proxy and handles TLS termination on port 443)
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Default device (KAUF PLF10)
smartvolt.device.id=kauf-01

# Security
smartvolt.api.key=${SMARTVOLT_API_KEY}
smartvolt.dashboard.username=${DASHBOARD_USERNAME:admin}
smartvolt.dashboard.password=${DASHBOARD_PASSWORD}
