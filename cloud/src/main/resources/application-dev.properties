# Dev profile — H2 in-memory, no PostgreSQL or S3 required
spring.datasource.url=jdbc:h2:mem:smartvolt-dev
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Fixed credentials for local dev
smartvolt.api.key=dev-key
smartvolt.dashboard.username=admin
smartvolt.dashboard.password=admin

# Disable S3
smartvolt.s3.enabled=false

# Show SQL for debugging
spring.jpa.show-sql=false
