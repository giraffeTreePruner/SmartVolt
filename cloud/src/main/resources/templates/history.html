<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title>SmartVolt - History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.2.0/dist/css/tabler.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
</head>
<body class="theme-dark">
    <div class="page">
        <!-- Navbar -->
        <header class="navbar navbar-expand-md d-print-none">
            <div class="container-xl">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
                    <a href="/dashboard" class="text-decoration-none d-flex align-items-center gap-2">
                        <i class="ti ti-bolt text-yellow"></i>
                        <span>SmartVolt</span>
                    </a>
                </h1>
                <div class="collapse navbar-collapse" id="navbar-menu">
                    <div class="d-flex flex-column flex-md-row flex-fill align-items-stretch align-items-md-center">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link" href="/dashboard">
                                    <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti ti-dashboard"></i></span>
                                    <span class="nav-link-title">Live</span>
                                </a>
                            </li>
                            <li class="nav-item active">
                                <a class="nav-link" href="/dashboard/history">
                                    <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti ti-chart-line"></i></span>
                                    <span class="nav-link-title">History</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/dashboard/sessions">
                                    <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti ti-battery-charging"></i></span>
                                    <span class="nav-link-title">Sessions</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                    <div class="navbar-nav flex-row order-md-last">
                        <form th:action="@{/logout}" method="post" class="d-flex align-items-center">
                            <button type="submit" class="btn btn-ghost-secondary btn-sm">
                                <i class="ti ti-logout me-1"></i>Logout
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </header>

        <!-- Page body -->
        <div class="page-wrapper">
            <div class="page-header d-print-none">
                <div class="container-xl">
                    <div class="page-pretitle">Analytics</div>
                    <h2 class="page-title">Telemetry History</h2>
                </div>
            </div>
            <div class="page-body">
                <div class="container-xl">
                    <!-- Controls -->
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="row g-3 align-items-end">
                                <div class="col-auto">
                                    <label class="form-label">Device</label>
                                    <select id="device-select" class="form-select">
                                        <option th:each="device : ${devices}"
                                                th:value="${device.deviceId}"
                                                th:text="${device.name != null ? device.name : device.deviceId}">Device</option>
                                    </select>
                                </div>
                                <div class="col-auto">
                                    <label class="form-label">Time Range</label>
                                    <div class="btn-group" role="group">
                                        <input type="radio" class="btn-check" name="range" id="range-1" value="1"/>
                                        <label class="btn btn-outline-secondary" for="range-1">1H</label>
                                        <input type="radio" class="btn-check" name="range" id="range-6" value="6"/>
                                        <label class="btn btn-outline-secondary" for="range-6">6H</label>
                                        <input type="radio" class="btn-check" name="range" id="range-24" value="24" checked="checked"/>
                                        <label class="btn btn-outline-secondary" for="range-24">24H</label>
                                        <input type="radio" class="btn-check" name="range" id="range-168" value="168"/>
                                        <label class="btn btn-outline-secondary" for="range-168">7D</label>
                                    </div>
                                </div>
                                <div class="col-auto">
                                    <button class="btn btn-primary" onclick="loadChart()">
                                        <i class="ti ti-refresh me-1"></i>Load
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Chart -->
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Power Telemetry</h3>
                        </div>
                        <div class="card-body">
                            <div id="telemetry-chart" style="height: 400px;"></div>
                            <div id="chart-empty" class="text-center text-secondary py-5" style="display: none;">
                                <i class="ti ti-chart-line-off mb-2" style="font-size: 2rem;"></i>
                                <p>No data available for selected range.</p>
                            </div>
                        </div>
                    </div>

                    <div th:if="${#lists.isEmpty(devices)}" class="card">
                        <div class="empty">
                            <div class="empty-icon"><i class="ti ti-plug-connected-x" style="font-size: 3rem;"></i></div>
                            <p class="empty-title">No devices registered</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.2.0/dist/js/tabler.min.js"></script>
    <script>
        let chart = null;

        function getSelectedRange() {
            const checked = document.querySelector('input[name="range"]:checked');
            return checked ? parseInt(checked.value) : 24;
        }

        function loadChart() {
            const deviceId = document.getElementById('device-select').value;
            if (!deviceId) return;

            const hours = getSelectedRange();
            const to = new Date().toISOString();
            const from = new Date(Date.now() - hours * 3600000).toISOString();

            fetch(`/dashboard/api/history/data?deviceId=${encodeURIComponent(deviceId)}&from=${from}&to=${to}`)
                .then(r => r.json())
                .then(data => {
                    if (data.length === 0) {
                        document.getElementById('telemetry-chart').style.display = 'none';
                        document.getElementById('chart-empty').style.display = 'block';
                        if (chart) { chart.destroy(); chart = null; }
                        return;
                    }
                    document.getElementById('telemetry-chart').style.display = 'block';
                    document.getElementById('chart-empty').style.display = 'none';
                    renderChart(data);
                })
                .catch(err => console.error('Failed to load chart data:', err));
        }

        function renderChart(data) {
            const timestamps = data.map(d => new Date(d.timestamp).getTime());

            const options = {
                chart: {
                    type: 'line',
                    height: 400,
                    background: 'transparent',
                    toolbar: { show: true, tools: { download: true, selection: true, zoom: true, pan: true } },
                    animations: { enabled: true, easing: 'easeinout', speed: 400 }
                },
                theme: { mode: 'dark', palette: 'palette1' },
                series: [
                    { name: 'Wattage (W)', data: data.map((d, i) => [timestamps[i], d.wattage]) },
                    { name: 'Voltage (V)', data: data.map((d, i) => [timestamps[i], d.voltage]) },
                    { name: 'Amperage (A)', data: data.map((d, i) => [timestamps[i], d.amperage]) }
                ],
                colors: ['#e74c3c', '#3498db', '#2ecc71'],
                stroke: { width: [2, 2, 2], curve: 'smooth' },
                fill: {
                    type: ['gradient', 'solid', 'solid'],
                    gradient: { shadeIntensity: 1, opacityFrom: 0.3, opacityTo: 0.05, stops: [0, 90, 100] }
                },
                xaxis: {
                    type: 'datetime',
                    labels: { datetimeUTC: false }
                },
                yaxis: [
                    { title: { text: 'Wattage (W)' }, labels: { formatter: v => v != null ? v.toFixed(0) : '' } },
                    {
                        opposite: true,
                        title: { text: 'Voltage (V)' },
                        labels: { formatter: v => v != null ? v.toFixed(0) : '' }
                    },
                    { show: false, labels: { formatter: v => v != null ? v.toFixed(1) : '' } }
                ],
                tooltip: {
                    shared: true,
                    x: { format: 'MMM dd, HH:mm:ss' }
                },
                legend: { position: 'top', horizontalAlign: 'left' },
                grid: { borderColor: '#2a2e3d', strokeDashArray: 4 }
            };

            if (chart) { chart.destroy(); }
            chart = new ApexCharts(document.getElementById('telemetry-chart'), options);
            chart.render();
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (document.getElementById('device-select').value) {
                loadChart();
            }
            // Reload on range change
            document.querySelectorAll('input[name="range"]').forEach(r => {
                r.addEventListener('change', loadChart);
            });
        });
    </script>
</body>
</html>
