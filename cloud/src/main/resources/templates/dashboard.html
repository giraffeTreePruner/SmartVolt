<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SmartVolt - Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <nav class="navbar">
        <a href="/dashboard" class="nav-brand">SmartVolt</a>
        <div class="nav-links">
            <a href="/dashboard" class="active">Live</a>
            <a href="/dashboard/history">History</a>
            <a href="/dashboard/sessions">Sessions</a>
        </div>
        <form th:action="@{/logout}" method="post" class="nav-logout">
            <button type="submit" class="btn btn-sm">Logout</button>
        </form>
    </nav>

    <main class="container">
        <h2>Live Readings</h2>

        <div id="live-readings"
             hx-get="/dashboard/api/live"
             hx-trigger="load, every 5s"
             hx-swap="innerHTML">

            <div th:each="device : ${devices}" class="device-card">
                <div class="device-header">
                    <h3 th:text="${device.name != null ? device.name : device.deviceId}">Device</h3>
                    <span th:class="'status-badge ' + (${device.online} ? 'online' : 'offline')"
                          th:text="${device.online} ? 'Online' : 'Offline'">Status</span>
                </div>

                <div th:if="${latestReadings.containsKey(device.deviceId)}"
                     th:with="reading=${latestReadings.get(device.deviceId)}" class="readings-grid">
                    <div class="reading-card">
                        <span class="reading-label">Wattage</span>
                        <span class="reading-value" th:text="${reading.wattage != null ? #numbers.formatDecimal(reading.wattage, 1, 1) + ' W' : '--'}">-- W</span>
                    </div>
                    <div class="reading-card">
                        <span class="reading-label">Voltage</span>
                        <span class="reading-value" th:text="${reading.voltage != null ? #numbers.formatDecimal(reading.voltage, 1, 1) + ' V' : '--'}">-- V</span>
                    </div>
                    <div class="reading-card">
                        <span class="reading-label">Amperage</span>
                        <span class="reading-value" th:text="${reading.amperage != null ? #numbers.formatDecimal(reading.amperage, 1, 1) + ' A' : '--'}">-- A</span>
                    </div>
                    <div class="reading-card">
                        <span class="reading-label">Total Energy</span>
                        <span class="reading-value" th:text="${reading.totalKwh != null ? #numbers.formatDecimal(reading.totalKwh, 1, 3) + ' kWh' : '--'}">-- kWh</span>
                    </div>
                </div>
                <div th:unless="${latestReadings.containsKey(device.deviceId)}" class="no-data">
                    No telemetry data yet
                </div>

                <div class="device-actions">
                    <form th:action="@{/dashboard/devices/{id}/power(id=${device.deviceId})}" method="post" class="power-form">
                        <input type="hidden" name="on" value="true"/>
                        <button type="submit" class="btn btn-on">ON</button>
                    </form>
                    <form th:action="@{/dashboard/devices/{id}/power(id=${device.deviceId})}" method="post" class="power-form">
                        <input type="hidden" name="on" value="false"/>
                        <button type="submit" class="btn btn-off">OFF</button>
                    </form>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(devices)}" class="no-data">
                No devices registered. Use the API to register a device first.
            </div>
        </div>
    </main>
</body>
</html>
