spring.application.name=SmartVolt Edge

# H2 local buffer (file-mode for persistence across restarts)
spring.datasource.url=jdbc:h2:file:./data/edge-buffer
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Local MQTT broker (plaintext — plug is on same LAN)
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client.id=smartvolt-edge
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.topic.telemetry=smartvolt/devices/+/tele/SENSOR
mqtt.topic.lwt=smartvolt/devices/+/tele/LWT

# Cloud sync
smartvolt.cloud.url=https://smartvolt.drewmeyers.com
smartvolt.cloud.api-key=${CLOUD_API_KEY}
smartvolt.batch.interval=30000
smartvolt.command.poll-interval=5000

# Device key validation (deviceId -> raw key, hashed at startup)
smartvolt.device-keys={'kauf-01': '${KAUF01_DEVICE_KEY:}'}

# Default device for command polling
smartvolt.device.id=kauf-01

# HTTP
server.port=8081

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
