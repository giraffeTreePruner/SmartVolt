# SmartVolt Mosquitto Configuration
# TLS-only — no plaintext listener

# Listener: TLS on 8883
listener 8883
protocol mqtt

# TLS Certificates (Let's Encrypt)
cafile /etc/letsencrypt/live/smartvolt.drewmeyers.com/chain.pem
certfile /etc/letsencrypt/live/smartvolt.drewmeyers.com/fullchain.pem
keyfile /etc/letsencrypt/live/smartvolt.drewmeyers.com/privkey.pem

# Require TLS 1.2+
tls_version tlsv1.2

# Authentication
allow_anonymous false
password_file /etc/mosquitto/passwd

# Access Control
acl_file /etc/mosquitto/acl.conf

# Logging
log_dest syslog
log_type warning
log_type error
log_type notice
