services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: smartvolt
            POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
            POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - "127.0.0.1:5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME} -d smartvolt"]
            interval: 5s
            timeout: 3s
            retries: 5

    cloud:
        build:
            context: .
            dockerfile: cloud/Dockerfile
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        env_file: .env
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartvolt
            SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
            SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
            SMARTVOLT_API_KEY: ${SMARTVOLT_API_KEY}
            DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
            DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
            S3_ENABLED: ${S3_ENABLED:-false}
            S3_ENDPOINT: ${S3_ENDPOINT:-https://us-east-1.linodeobjects.com}
            S3_BUCKET: ${S3_BUCKET:-smartvolt-telemetry-archive}
            S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
            S3_SECRET_KEY: ${S3_SECRET_KEY:-}
        ports:
            - "127.0.0.1:8080:8080"

volumes:
    pgdata:
