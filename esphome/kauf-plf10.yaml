# SmartVolt ESPHome config for KAUF PLF10
#
# The KAUF PLF10 ships pre-flashed with ESPHome. This config replaces the
# default Home Assistant integration with MQTT for SmartVolt.
#
# Setup:
#   1. Copy secrets.yaml.example to secrets.yaml and fill in real values
#   2. Generate a device key: openssl rand -hex 16
#   3. Set device_key below to that value
#   4. Flash: esphome run kauf-plf10.yaml
#   5. Register the device via the SmartVolt REST API with the same key

substitutions:
  device_name: kauf-01
  device_key: !secret device_key

packages:
  kauf_plf10: github://KaufHA/PLF10/kauf-plug.yaml

esphome:
  name: ${device_name}
  name_add_mac_suffix: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Remove HA-dependent components from the KAUF package — we use MQTT instead
api: !remove
time:
  - id: !remove homeassistant_time
  - platform: sntp
    id: sntp_time

# NOTE: The KAUF PLF10 is ESP8285-based (ESP8266 family). TLS on ESP8266
# uses BearSSL with limited RAM. If you hit memory issues with TLS:
#   - Try port 1883 with broker-level auth as a fallback
#   - Or use an ESP32-based plug instead
# If your broker supports TLS (port 8883), uncomment certificate_authority
# and point it to your CA cert (e.g. Let's Encrypt ISRG Root X1).
mqtt:
  broker: smartvolt.drewmeyers.com
  port: 8883
  username: !secret mqtt_username
  password: !secret mqtt_password
  # certificate_authority: ca.pem
  topic_prefix: smartvolt/devices/${device_name}
  discovery: false
  birth_message:
    topic: smartvolt/devices/${device_name}/tele/LWT
    payload: Online
  will_message:
    topic: smartvolt/devices/${device_name}/tele/LWT
    payload: Offline

# Publishes bundled JSON telemetry every 10 seconds with device key
# injected via the mqtt.publish_json lambda.
interval:
  - interval: 10s
    then:
      - mqtt.publish_json:
          topic: smartvolt/devices/${device_name}/tele/SENSOR
          payload: |-
            root["key"] = "${device_key}";
            root["wattage"] = id(wattage).state;
            root["voltage"] = id(voltage).state;
            root["amperage"] = id(current).state;
            root["totalKwh"] = id(tde).state;

# Hide the KAUF package sensors from individual MQTT publishing —
# the interval block above bundles them into one authenticated payload.
sensor:
  - id: !extend hlw_main
    power:
      internal: true
    voltage:
      internal: true
    current:
      internal: true
  - id: !extend tde
    internal: true

# Add MQTT command/state topics to the KAUF package relay
switch:
  - id: !extend relay
    command_topic: smartvolt/devices/${device_name}/cmnd/Power
    state_topic: smartvolt/devices/${device_name}/stat/POWER
