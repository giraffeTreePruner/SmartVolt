name: SmartVolt Cloud CI

on:
  push:
    branches: [ main ]
    paths:
      - 'shared/**'
      - 'cloud/**'
      - 'pom.xml'
  pull_request:
    branches: [ main ]
    paths:
      - 'shared/**'
      - 'cloud/**'
      - 'pom.xml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: maven

    - name: Build and Test (shared + cloud)
      run: |
        chmod +x mvnw
        ./mvnw verify -B -pl shared,cloud -am
