name: SmartVolt CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartvolt
          POSTGRES_USER: smartvolt
          POSTGRES_PASSWORD: pass # these are fake anyway, just for testing connectivity
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U smartvolt -d smartvolt"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

      mosquito:
        image: eclipse-mosquitto:2.0
        ports:
          - 1883:1883
        options: >-
          --health-cmd "mosquitto_sub -h localhost -p 1883 -t '$$SYS/#' -C 1 -W 3 || true"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 3
    
    env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smartvolt
        SPRING_DATASOURCE_USERNAME: ci_user
        SPRING_DATASOURCE_PASSWORD: ci_password
        MQTT_USERNAME: ""
        MQTT_PASSWORD: ""
        SMARTVOLT_API_KEY: ci-test-key

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: maven

    - name: Build and Test
      run: |
        chmod +x mvnw
        ./mvnw verify -B \
          -Dspring.profiles.active=ci \
          -Dspring.datasource.url=$SPRING_DATASOURCE_URL \
          -Dspring.datasource.username=$SPRING_DATASOURCE_USERNAME \
          -Dspring.datasource.password=$SPRING_DATASOURCE_PASSWORD \
          -Dmqtt.broker.url=tcp://localhost:1883 \
          -Dmqtt.tls.ca-cert-path= \
          -Dsmartvolt.api.key=$SMARTVOLT_API_KEY